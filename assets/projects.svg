<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 540" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="proj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="proj-card-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#070e1c"/>
    </linearGradient>
    <linearGradient id="proj-card-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26101c"/>
      <stop offset="100%" stop-color="#0d0812"/>
    </linearGradient>
    <linearGradient id="proj-card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2236"/>
      <stop offset="100%" stop-color="#06121c"/>
    </linearGradient>
    <linearGradient id="proj-card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1233"/>
      <stop offset="100%" stop-color="#0b0817"/>
    </linearGradient>
    <linearGradient id="proj-card-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d261e"/>
      <stop offset="100%" stop-color="#061410"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="stroke-neon-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="stroke-neon-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <linearGradient id="stroke-neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <style>
      @keyframes pulseBeacon {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.35; transform: scale(0.85); }
      }
      @keyframes borderGlow {
        0%, 100% { stroke-opacity: 0.85; }
        50% { stroke-opacity: 0.4; }
      }
      .beacon { animation: pulseBeacon 2.5s ease-in-out infinite; }
      .glow-border { animation: borderGlow 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .beacon, .glow-border { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Base Canvas -->
  <rect x="0" y="0" width="940" height="540" rx="24" fill="url(#proj-bg)"/>
  <rect x="2" y="2" width="936" height="536" rx="23" fill="none" stroke="#247bff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Cyber Corners -->
  <path d="M 16 34 L 16 16 L 34 16" fill="none" stroke="#247bff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 924 34 L 924 16 L 906 16" fill="none" stroke="#ff354f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 506 L 16 524 L 34 524" fill="none" stroke="#247bff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 924 506 L 924 524 L 906 524" fill="none" stroke="#ff354f" stroke-width="2.5" stroke-linecap="round"/>

  <!-- SECTION TITLE HEADER -->
  <g transform="translate(48, 42)">
    <rect x="0" y="-12" width="28" height="24" rx="4" fill="#0f1f42" stroke="#247bff" stroke-width="1"/>
    <text x="7" y="5" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="12" font-weight="800">04</text>
    <text x="38" y="5" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="800" letter-spacing="1">
      FEATURED PROJECTS // REAL-WORLD ARCHITECTURES
    </text>
    <text x="560" y="5" fill="#64748b" font-family="'Segoe UI', monospace" font-size="11">
      5 ACTIVE REPOSITORIES: AI/ML • FULL STACK • COMPUTER VISION
    </text>
  </g>

  <!-- ================= ROW 1 (y: 80, height: 200, 3 CARDS) ================= -->

  <!-- CARD 1: TowerLens AI -->
  <g transform="translate(48, 80)">
    <rect x="0" y="0" width="268" height="200" rx="16" fill="url(#proj-card-crimson)" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="268" height="200" rx="16" fill="none" stroke="url(#stroke-neon-crimson)" stroke-width="1.3" class="glow-border"/>

    <!-- Header Badge -->
    <g transform="translate(16, 20)">
      <rect x="0" y="-8" width="24" height="20" rx="4" fill="#38101e"/>
      <text x="5" y="6" font-size="11">🏗️</text>
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">TowerLens AI</text>
      <circle cx="230" cy="4" r="4" fill="#ff354f" class="beacon"/>
    </g>
    <text x="16" y="44" fill="#ff758c" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">CV INSPECTION // YOLO PIPELINE</text>
    <line x1="16" y1="52" x2="252" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Description -->
    <text x="16" y="72" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      Automated structural detection system
    </text>
    <text x="16" y="88" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      for telecom tower components using
    </text>
    <text x="16" y="104" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      custom deep learning &amp; OpenCV.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="56" height="22" rx="6" fill="#33101c" stroke="#ff354f" stroke-width="0.8"/>
      <text x="10" y="15" fill="#ff758c" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">YOLO</text>

      <rect x="62" y="0" width="68" height="22" rx="6" fill="#1b122e" stroke="#a855f7" stroke-width="0.8"/>
      <text x="10" y="15" fill="#d8b4fe" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">OpenCV</text>

      <rect x="136" y="0" width="60" height="22" rx="6" fill="#0d2438" stroke="#00f2fe" stroke-width="0.8"/>
      <text x="10" y="15" fill="#7dd3fc" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">FastAPI</text>

      <rect x="0" y="28" width="58" height="22" rx="6" fill="#0c2336" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="10" y="43" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">React</text>
    </g>

    <text x="16" y="184" fill="#64748b" font-family="'Segoe UI', monospace" font-size="9.5">&gt; REPO: gowtham-cr/TowerLens</text>
  </g>

  <!-- CARD 2: NextStep AI -->
  <g transform="translate(336, 80)">
    <rect x="0" y="0" width="268" height="200" rx="16" fill="url(#proj-card-cyan)" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="268" height="200" rx="16" fill="none" stroke="url(#stroke-neon-cyan)" stroke-width="1.3" class="glow-border"/>

    <!-- Header Badge -->
    <g transform="translate(16, 20)">
      <rect x="0" y="-8" width="24" height="20" rx="4" fill="#0c2d3d"/>
      <text x="5" y="6" font-size="11">🎯</text>
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">NextStep AI</text>
      <circle cx="230" cy="4" r="4" fill="#00f2fe" class="beacon"/>
    </g>
    <text x="16" y="44" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">PLACEMENT COPILOT // NLP</text>
    <line x1="16" y1="52" x2="252" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Description -->
    <text x="16" y="72" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      Intelligent career copilot for students
    </text>
    <text x="16" y="88" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      with automated resume review, skill
    </text>
    <text x="16" y="104" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      gap analysis &amp; interview roadmap.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1b122e" stroke="#a855f7" stroke-width="0.8"/>
      <text x="10" y="15" fill="#d8b4fe" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">AI / ML</text>

      <rect x="66" y="0" width="46" height="22" rx="6" fill="#0d2438" stroke="#00f2fe" stroke-width="0.8"/>
      <text x="10" y="15" fill="#7dd3fc" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">NLP</text>

      <rect x="118" y="0" width="62" height="22" rx="6" fill="#0c1f3d" stroke="#247bff" stroke-width="0.8"/>
      <text x="10" y="15" fill="#93c5fd" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">Python</text>

      <rect x="0" y="28" width="58" height="22" rx="6" fill="#0c2336" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="10" y="43" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">React</text>
    </g>

    <text x="16" y="184" fill="#64748b" font-family="'Segoe UI', monospace" font-size="9.5">&gt; REPO: gowtham-cr/NextStep-AI</text>
  </g>

  <!-- CARD 3: AMC College AI Chatbot -->
  <g transform="translate(624, 80)">
    <rect x="0" y="0" width="268" height="200" rx="16" fill="url(#proj-card-purple)" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="268" height="200" rx="16" fill="none" stroke="#a855f7" stroke-width="1.3" class="glow-border"/>

    <!-- Header Badge -->
    <g transform="translate(16, 20)">
      <rect x="0" y="-8" width="24" height="20" rx="4" fill="#28113a"/>
      <text x="5" y="6" font-size="11">🤖</text>
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">AMC AI Chatbot</text>
      <circle cx="230" cy="4" r="4" fill="#a855f7" class="beacon"/>
    </g>
    <text x="16" y="44" fill="#c084fc" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">CAMPUS ASSISTANT // 24/7 BOT</text>
    <line x1="16" y1="52" x2="252" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Description -->
    <text x="16" y="72" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      24/7 conversational assistance system
    </text>
    <text x="16" y="88" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      for AMC Engineering College students
    </text>
    <text x="16" y="104" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="500">
      for schedules, syllabus &amp; facilities.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(16, 126)">
      <rect x="0" y="0" width="75" height="22" rx="6" fill="#20112e" stroke="#c084fc" stroke-width="0.8"/>
      <text x="8" y="15" fill="#e9d5ff" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">AI Chatbot</text>

      <rect x="81" y="0" width="60" height="22" rx="6" fill="#0c1f3d" stroke="#247bff" stroke-width="0.8"/>
      <text x="8" y="15" fill="#93c5fd" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">Python</text>

      <rect x="147" y="0" width="75" height="22" rx="6" fill="#0d2438" stroke="#00f2fe" stroke-width="0.8"/>
      <text x="8" y="15" fill="#7dd3fc" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">REST APIs</text>
    </g>

    <text x="16" y="184" fill="#64748b" font-family="'Segoe UI', monospace" font-size="9.5">&gt; REPO: gowtham-cr/AMC-Chatbot</text>
  </g>

  <!-- ================= ROW 2 (y: 300, height: 200, 2 CARDS) ================= -->

  <!-- CARD 4: Inventory Management System -->
  <g transform="translate(48, 300)">
    <rect x="0" y="0" width="420" height="200" rx="16" fill="url(#proj-card-blue)" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="420" height="200" rx="16" fill="none" stroke="url(#stroke-neon-blue)" stroke-width="1.3" class="glow-border"/>

    <!-- Header Badge -->
    <g transform="translate(20, 20)">
      <rect x="0" y="-8" width="24" height="20" rx="4" fill="#13274f"/>
      <text x="5" y="6" font-size="11">📦</text>
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">Inventory Management System</text>
      <circle cx="380" cy="4" r="4" fill="#247bff" class="beacon"/>
    </g>
    <text x="20" y="44" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">ENTERPRISE WEB // CRUD ARCHITECTURE</text>
    <line x1="20" y1="52" x2="400" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Description -->
    <text x="20" y="72" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">
      Full-stack enterprise application designed to track, allocate, and audit
    </text>
    <text x="20" y="88" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">
      organizational inventory and employee hardware asset operations.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="60" height="24" rx="8" fill="#0c2336" stroke="#38bdf8" stroke-width="0.8"/>
      <text x="12" y="16" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">React</text>

      <rect x="68" y="0" width="74" height="24" rx="8" fill="#0d281e" stroke="#10b981" stroke-width="0.8"/>
      <text x="12" y="16" fill="#6ee7b7" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">Node.js</text>

      <rect x="150" y="0" width="86" height="24" rx="8" fill="#1c1f38" stroke="#60a5fa" stroke-width="0.8"/>
      <text x="12" y="16" fill="#93c5fd" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">Express.js</text>

      <rect x="244" y="0" width="66" height="24" rx="8" fill="#0c1f3d" stroke="#247bff" stroke-width="0.8"/>
      <text x="12" y="16" fill="#93c5fd" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">MySQL</text>
    </g>

    <text x="20" y="178" fill="#64748b" font-family="'Segoe UI', monospace" font-size="10">
      &gt; RELATIONAL SCHEMA • MODULAR REST ENDPOINTS • ASSET TRACKING
    </text>
  </g>

  <!-- CARD 5: AI Disease Prediction System -->
  <g transform="translate(482, 300)">
    <rect x="0" y="0" width="420" height="200" rx="16" fill="url(#proj-card-emerald)" filter="url(#card-shadow)"/>
    <rect x="0" y="0" width="420" height="200" rx="16" fill="none" stroke="#10b981" stroke-width="1.3" class="glow-border"/>

    <!-- Header Badge -->
    <g transform="translate(20, 20)">
      <rect x="0" y="-8" width="24" height="20" rx="4" fill="#0e281e"/>
      <text x="5" y="6" font-size="11">🏥</text>
      <text x="32" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="800">AI Disease Prediction System</text>
      <circle cx="380" cy="4" r="4" fill="#10b981" class="beacon"/>
    </g>
    <text x="20" y="44" fill="#6ee7b7" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="700">HEALTHCARE AI // PREDICTIVE MODELLING</text>
    <line x1="20" y1="52" x2="400" y2="52" stroke="#1e293b" stroke-width="1"/>

    <!-- Description -->
    <text x="20" y="72" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">
      Healthcare predictive analytics platform engineered to forecast disease
    </text>
    <text x="20" y="88" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="11.5" font-weight="500">
      risks utilizing supervised machine learning classification algorithms.
    </text>

    <!-- Tech Stack Pills -->
    <g transform="translate(20, 114)">
      <rect x="0" y="0" width="66" height="24" rx="8" fill="#0c1f3d" stroke="#247bff" stroke-width="0.8"/>
      <text x="12" y="16" fill="#93c5fd" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">Python</text>

      <rect x="74" y="0" width="130" height="24" rx="8" fill="#28111e" stroke="#ff354f" stroke-width="0.8"/>
      <text x="12" y="16" fill="#ff758c" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">Machine Learning</text>

      <rect x="212" y="0" width="112" height="24" rx="8" fill="#0c2d22" stroke="#10b981" stroke-width="0.8"/>
      <text x="12" y="16" fill="#6ee7b7" font-family="'Segoe UI', monospace" font-size="10" font-weight="700">Healthcare AI</text>
    </g>

    <text x="20" y="178" fill="#64748b" font-family="'Segoe UI', monospace" font-size="10">
      &gt; CLINICAL DATA PROCESSING • INTERPRETABLE DIAGNOSTIC REPORTS
    </text>
  </g>
</svg>
