<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="about-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1228"/>
      <stop offset="100%" stop-color="#060914"/>
    </linearGradient>

    <!-- Card Background Gradients -->
    <linearGradient id="card-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1833"/>
      <stop offset="100%" stop-color="#080e1e"/>
    </linearGradient>

    <linearGradient id="card-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1129"/>
      <stop offset="100%" stop-color="#0a0a18"/>
    </linearGradient>

    <linearGradient id="card-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a2b"/>
      <stop offset="100%" stop-color="#07111c"/>
    </linearGradient>

    <linearGradient id="card-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241018"/>
      <stop offset="100%" stop-color="#0d0912"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="stroke-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="stroke-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="stroke-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="stroke-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0.4"/>
    </linearGradient>

    <radialGradient id="glow-bg-1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#247bff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#247bff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-bg-2" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#ff354f" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff354f" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes pulseBorder {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.5; }
      }

      .pulse-beacon { animation: pulseDot 2.2s ease-in-out infinite; }
      .border-glow { animation: pulseBorder 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .pulse-beacon, .border-glow {
          animation: none !important;
        }
      }
    </style>
