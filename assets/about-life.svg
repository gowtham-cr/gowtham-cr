  <rect x="0" y="0" width="940" height="560" rx="24" fill="url(#about-bg)"/>
  <rect x="0" y="0" width="940" height="560" fill="url(#glow-bg-1)"/>
  <rect x="0" y="0" width="940" height="560" fill="url(#glow-bg-2)"/>

  <!-- Perspective Grid Lines -->
  <g opacity="0.12" stroke="#247bff" stroke-width="1">
