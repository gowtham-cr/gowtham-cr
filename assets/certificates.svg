    <linearGradient id="cert-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b16"/>
      <stop offset="50%" stop-color="#0a1226"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Card Backgrounds -->
