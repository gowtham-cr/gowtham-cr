      <stop offset="0%" stop-color="#0d1b38"/>
      <stop offset="100%" stop-color="#070e1c"/>
    </linearGradient>
    <linearGradient id="cert-card-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#28111e"/>
      <stop offset="100%" stop-color="#0d0812"/>
    </linearGradient>
    <linearGradient id="cert-card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1233"/>
      <stop offset="100%" stop-color="#0b0817"/>
    </linearGradient>
    <linearGradient id="cert-card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2236"/>
      <stop offset="100%" stop-color="#06121c"/>
    </linearGradient>

    <!-- Border Gradients -->
    <linearGradient id="stroke-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="stroke-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#247bff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="stroke-crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff354f"/>
      <stop offset="100%" stop-color="#ff758c"/>
    </linearGradient>
    <linearGradient id="stroke-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cert-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      @keyframes badgePulse {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.55; }
      }
      .badge-glow { animation: badgePulse 2.8s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .badge-glow { animation: none !important; }
      }
    </style>
