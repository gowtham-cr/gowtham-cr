  <!-- Base Canvas -->
  <rect x="0" y="0" width="940" height="490" rx="24" fill="url(#cert-bg)"/>
  <rect x="2" y="2" width="936" height="486" rx="23" fill="none" stroke="#247bff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Cyber Corners -->
  <path d="M 16 34 L 16 16 L 34 16" fill="none" stroke="#247bff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 924 34 L 924 16 L 906 16" fill="none" stroke="#ff354f" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 16 456 L 16 474 L 34 474" fill="none" stroke="#247bff" stroke-width="2.5" stroke-linecap="round"/>
