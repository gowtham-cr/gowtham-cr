<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 110" width="100%" height="110">
  <defs>
    <linearGradient id="quote-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#070d17" />
    </linearGradient>

    <linearGradient id="quote-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="quote-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <style>
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-style: italic;
      font-size: 15px;
      font-weight: 400;
      fill: #e2e8f0;
      letter-spacing: 0.3px;
    }
    .author-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 600;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
  </style>

  <!-- Container -->
  <rect x="2" y="2" width="846" height="106" rx="12" fill="url(#quote-bg)" stroke="url(#quote-border)" stroke-width="1.2" />

  <!-- Decorative Quote Mark -->
  <text x="35" y="65" font-family="Georgia, serif" font-size="70" fill="url(#quote-mark-grad)" font-weight="bold">“</text>

  <!-- Quote Body -->
  <g text-anchor="middle" transform="translate(425, 0)">
    <text x="0" y="48" class="quote-text">
      “Building purposeful software at the intersection of robust full-stack engineering
    </text>
    <text x="0" y="70" class="quote-text">
      and intelligent machine learning systems.”
    </text>
    <text x="0" y="93" class="author-text">
      — GOWTHAM R
    </text>
  </g>
</svg>
