<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="160">
  <defs>
    <linearGradient id="step-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <linearGradient id="active-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <style>
    .step-num {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 11px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .step-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 700;
      font-size: 13px;
      fill: #f1f5f9;
    }
    .step-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 400;
      font-size: 10.5px;
      fill: #94a3b8;
    }
    .arrow {
      fill: #818cf8;
    }
  </style>

  <!-- Connecting Line -->
  <line x1="80" y1="80" x2="780" y2="80" stroke="url(#line-grad)" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Node 1: Academics -->
  <g transform="translate(15, 30)">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="url(#step-bg)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="0" r="10" fill="#0e1726" stroke="#38bdf8" stroke-width="2" />
    <text x="75" y="4" class="step-num" text-anchor="middle">01</text>
    <text x="75" y="32" class="step-title" text-anchor="middle">🎓 ISE Degree</text>
    <text x="75" y="52" class="step-desc" text-anchor="middle">AMC Engg College</text>
    <text x="75" y="70" class="step-desc" text-anchor="middle">B.E. 5th Semester</text>
  </g>

  <!-- Arrow 1 -->
  <polygon points="175,76 185,80 175,84" class="arrow" />

  <!-- Node 2: Full Stack -->
  <g transform="translate(190, 30)">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="url(#step-bg)" stroke="#60a5fa" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="0" r="10" fill="#0e1726" stroke="#60a5fa" stroke-width="2" />
    <text x="75" y="4" class="step-num" text-anchor="middle" fill="#60a5fa">02</text>
    <text x="75" y="32" class="step-title" text-anchor="middle">💻 Full Stack Dev</text>
    <text x="75" y="52" class="step-desc" text-anchor="middle">Java, Spring Boot</text>
    <text x="75" y="70" class="step-desc" text-anchor="middle">React &amp; Node.js</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="350,76 360,80 350,84" class="arrow" />

  <!-- Node 3: AI & Vision -->
  <g transform="translate(365, 30)">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="url(#step-bg)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="0" r="10" fill="#0e1726" stroke="#818cf8" stroke-width="2" />
    <text x="75" y="4" class="step-num" text-anchor="middle" fill="#818cf8">03</text>
    <text x="75" y="32" class="step-title" text-anchor="middle">🤖 AI &amp; Vision</text>
    <text x="75" y="52" class="step-desc" text-anchor="middle">Python, YOLO, CV</text>
    <text x="75" y="70" class="step-desc" text-anchor="middle">Machine Learning</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="525,76 535,80 525,84" class="arrow" />

  <!-- Node 4: Projects & Hackathons -->
  <g transform="translate(540, 30)">
    <rect x="0" y="0" width="150" height="100" rx="10" fill="url(#step-bg)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="0" r="10" fill="#0e1726" stroke="#a855f7" stroke-width="2" />
    <text x="75" y="4" class="step-num" text-anchor="middle" fill="#a855f7">04</text>
    <text x="75" y="32" class="step-title" text-anchor="middle">⚡ Real-World Apps</text>
    <text x="75" y="52" class="step-desc" text-anchor="middle">TowerLens, NextStep</text>
    <text x="75" y="70" class="step-desc" text-anchor="middle">Hackathon Solutions</text>
  </g>

  <!-- Arrow 4 -->
  <polygon points="700,76 710,80 700,84" class="arrow" />

  <!-- Node 5: Placement & Career Goal -->
  <g transform="translate(715, 30)">
    <rect x="0" y="0" width="135" height="100" rx="10" fill="url(#active-bg)" stroke="#34d399" stroke-width="1.5" />
    <circle cx="67" cy="0" r="10" fill="#064e3b" stroke="#34d399" stroke-width="2" />
    <text x="67" y="4" class="step-num" text-anchor="middle" fill="#34d399">05</text>
    <text x="67" y="32" class="step-title" text-anchor="middle" fill="#34d399">🚀 Target: SDE</text>
    <text x="67" y="52" class="step-desc" text-anchor="middle">Software Engineer</text>
    <text x="67" y="70" class="step-desc" text-anchor="middle">Placement Ready</text>
  </g>
</svg>
