<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#101726" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Card Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#a855f7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Accent Pill Gradient -->
    <linearGradient id="pill-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.25" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.07" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      letter-spacing: 2px;
      fill: url(#text-grad);
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 15px;
      letter-spacing: 2px;
      fill: #94a3b8;
      text-transform: uppercase;
    }
    .badge-text {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.5px;
      fill: #e0f2fe;
    }
    .code-bracket {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 400;
      font-size: 28px;
      fill: #38bdf8;
      opacity: 0.5;
    }
    .college-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.8px;
      fill: #38bdf8;
    }
  </style>

  <!-- Background Base with Border -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect x="2" y="2" width="896" height="236" rx="16" fill="url(#grid)" />

  <!-- Ambient Ambient Glows -->
  <circle cx="120" cy="60" r="80" fill="#38bdf8" fill-opacity="0.12" filter="url(#glow)" />
  <circle cx="800" cy="180" r="90" fill="#a855f7" fill-opacity="0.10" filter="url(#glow)" />
  <circle cx="500" cy="120" r="100" fill="#6366f1" fill-opacity="0.08" filter="url(#glow)" />

  <!-- Decorative Circuit / Tech Elements -->
  <g opacity="0.4">
    <!-- Top right tech corner -->
    <path d="M 840 30 L 870 30 L 870 60" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="840" cy="30" r="2.5" fill="#38bdf8" />
    <circle cx="870" cy="60" r="2.5" fill="#38bdf8" />

    <!-- Top left tech corner -->
    <path d="M 60 30 L 30 30 L 30 60" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="60" cy="30" r="2.5" fill="#818cf8" />
    <circle cx="30" cy="60" r="2.5" fill="#818cf8" />

    <!-- Bottom left tech corner -->
    <path d="M 30 180 L 30 210 L 60 210" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="30" cy="180" r="2.5" fill="#38bdf8" />
    <circle cx="60" cy="210" r="2.5" fill="#38bdf8" />

    <!-- Bottom right tech corner -->
    <path d="M 870 180 L 870 210 L 840 210" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-linecap="round" />
    <circle cx="870" cy="180" r="2.5" fill="#c084fc" />
    <circle cx="840" cy="210" r="2.5" fill="#c084fc" />
  </g>

  <!-- Main Content Centered -->
  <g text-anchor="middle">
    <!-- Code Bracket Accents -->
    <text x="210" y="85" class="code-bracket">&lt;/&gt;</text>
    <text x="690" y="85" class="code-bracket">&lt;/&gt;</text>

    <!-- Main Title -->
    <text x="450" y="88" class="title">GOWTHAM R</text>

    <!-- Subtitle -->
    <text x="450" y="118" class="subtitle">JAVA FULL STACK DEVELOPER  •  AI &amp; COMPUTER VISION</text>

    <!-- College Tagline -->
    <text x="450" y="145" class="college-text">AMC Engineering College  |  B.E. Information Science &amp; Engineering</text>

    <!-- Badges Row -->
    <g transform="translate(0, 168)">
      <!-- Badge 1: Full Stack -->
      <g transform="translate(180, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="url(#pill-grad-1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#38bdf8" />
        <text x="88" y="20" class="badge-text" text-anchor="middle">Full Stack Dev</text>
      </g>

      <!-- Badge 2: AI / ML & Vision -->
      <g transform="translate(365, 0)">
        <rect x="0" y="0" width="170" height="32" rx="16" fill="url(#pill-grad-1)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#818cf8" />
        <text x="93" y="20" class="badge-text" text-anchor="middle">AI &amp; Computer Vision</text>
      </g>

      <!-- Badge 3: Hackathon Builder -->
      <g transform="translate(560, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="url(#pill-grad-1)" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1" />
        <circle cx="16" cy="16" r="4" fill="#c084fc" />
        <text x="88" y="20" class="badge-text" text-anchor="middle">Hackathon Builder</text>
      </g>
    </g>
  </g>
</svg>
